<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Форма — трекер тренировок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0e1014;--panel:#171a21;--panel2:#1f232d;--well:#0b0d11;--line:#2a2f3b;--ink:#eef0f4;--mute:#8b93a5;--acc:#f2c14e;--accink:#2a1f00;--green:#4fd08a;--red:#f0616d;--blue:#5aa9f5;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
body{padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom));min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.card h2{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
.card h3{font-size:17px;margin:0 0 2px}
.mute{color:var(--mute)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.wrapf{flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-weight:600;transition:transform .06s,opacity .1s}
.btn:active{transform:scale(.97)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.btn.green{background:var(--green);border-color:var(--green);color:#04240f}
.btn.red{background:none;border-color:#5a2a31;color:var(--red)}
.btn.wide{width:100%}
.btn:disabled{opacity:.4}
.bar{height:8px;background:var(--well);border-radius:99px;position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--c,var(--acc));border-radius:99px;transition:width .3s}
.tag{font-size:10px;font-weight:700;letter-spacing:.08em;padding:4px 8px;border-radius:99px;background:rgba(79,208,138,.15);color:var(--green);white-space:nowrap}
/* hero */
.hero{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center}
.sprite{width:76px;height:76px;background:var(--well);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sprite svg{width:100%;height:100%;display:block}
.lvl{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--acc);text-transform:uppercase}
.name{font-size:19px;font-weight:700;margin:1px 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gear{width:38px;height:38px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;align-self:start}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi{background:var(--well);border-radius:12px;padding:10px 6px;text-align:center}
.kpi b{display:block;font-size:19px;font-weight:700}
.kpi span{font-size:11px;color:var(--mute)}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:7px 10px;align-items:center;margin-top:14px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--mute)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(14,16,20,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav .in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:560px;width:100%}
nav button{background:none;border:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:10.5px;font-weight:600}
nav button.on{color:var(--acc)}
/* workout */
.pick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.pick::-webkit-scrollbar{display:none}
.pick button{flex:0 0 auto;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:99px;font-size:13px;font-weight:600;color:var(--mute)}
.pick button.on{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.pick button.nx{border-color:var(--acc);color:var(--ink)}
.badge{width:46px;height:46px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:16px;color:var(--acc);flex:0 0 auto}
.blockt{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:18px 2px 8px}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.ex.complete{border-color:rgba(79,208,138,.45)}
.exh{display:flex;gap:12px;align-items:center;padding:12px 14px;width:100%;background:none;border:none;text-align:left}
.exh .ix{width:26px;height:26px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mute);flex:0 0 auto}
.ex.complete .ix{background:var(--green);color:#04240f}
.exh .t{flex:1;min-width:0}
.exh .t b{display:block;font-size:15px;font-weight:600}
.exh .t span{font-size:12.5px;color:var(--mute)}
.exh .cnt{font-size:13px;font-weight:700;color:var(--mute)}
.exb{padding:0 14px 14px}
.sets{display:grid;gap:6px}
.set,.seth{display:grid;grid-template-columns:20px 1fr 1fr 44px;gap:8px;align-items:center}
.set.one,.seth.one{grid-template-columns:20px 1fr 44px}
.seth{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:center;margin-top:6px}
.set .n{font-size:12px;font-weight:700;color:var(--mute);text-align:center}
.stp{display:grid;grid-template-columns:32px 1fr 32px;background:var(--well);border-radius:10px;height:42px;align-items:center}
.stp button{background:none;border:none;height:42px;font-size:20px;color:var(--mute)}
.stp input{width:100%;background:none;border:none;text-align:center;font-weight:700;font-size:17px;padding:0;outline:none;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.set .ck{height:42px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:17px;font-weight:700;color:var(--mute)}
.set.d .ck{background:var(--green);border-color:var(--green);color:#04240f}
.set.d .stp{opacity:.75}
.hint{background:rgba(242,193,78,.1);border:1px solid rgba(242,193,78,.3);border-radius:10px;padding:9px 12px;font-size:13px;margin:8px 0;color:#f6dc9a}
.warn{background:rgba(240,97,109,.1);border:1px solid rgba(240,97,109,.3);border-radius:10px;padding:9px 12px;font-size:13px;margin:8px 0;color:#f7b5bb}
.det{font-size:13.5px;margin-top:8px}
.det ul,.det ol{margin:4px 0 8px;padding-left:20px}
.det li{margin:3px 0}
.det h4{margin:12px 0 2px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--acc)}
.links{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.link{background:none;border:none;color:var(--blue);padding:4px 0;font-size:13px;font-weight:600}
.habit{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--well);border:none;border-radius:11px;margin-bottom:6px;width:100%;text-align:left}
.habit .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;flex:0 0 auto}
.habit.on .box{background:var(--green);border-color:var(--green);color:#04240f}
.habit .xp{margin-left:auto;font-size:11px;font-weight:700;color:var(--acc)}
/* progress */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{width:100%;aspect-ratio:1;background:var(--well);border-radius:4px}
.heat i.p{background:#285a3d}
.heat i.f{background:var(--green)}
.heat i.t{outline:1.5px solid var(--acc);outline-offset:1px}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ach div{background:var(--well);border-radius:12px;padding:10px 4px;text-align:center;font-size:11px}
.ach div b{display:block;font-size:22px;margin-bottom:3px}
.ach div.lock{opacity:.3;filter:grayscale(1)}
.f{width:100%;background:var(--well);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.f:focus{border-color:var(--acc)}
textarea.f{min-height:90px;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:8px 12px;border:1px solid var(--line);background:var(--well);border-radius:99px;font-size:13px;font-weight:600;color:var(--mute)}
.chips button.on{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.fl{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:14px 0 6px}
.sched div{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.sched div:last-child{border:none}
.sched div b{width:26px;color:var(--mute);font-size:12px}
.sched div.tr b{color:var(--acc)}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}
/* overlays */
#rest{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));display:none;justify-content:center;z-index:19;padding:0 16px}
#rest .in{max-width:528px;width:100%;background:var(--blue);color:#04203c;border-radius:14px;padding:9px 10px 9px 16px;display:flex;align-items:center;gap:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#rest .tm{font-size:20px;font-weight:800}
#rest button{background:rgba(4,32,60,.16);color:#04203c;border:none;border-radius:10px;padding:8px 12px;font-weight:700}
#rest button:first-of-type{margin-left:auto}
#modal{position:fixed;inset:0;background:rgba(5,6,9,.72);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
#modal .in{max-width:420px;width:100%;max-height:85vh;overflow:auto;margin:0}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
#toast div{background:var(--ink);color:#111;border-radius:12px;padding:9px 14px;font-weight:600;font-size:13px;animation:tin .2s ease-out;box-shadow:0 6px 20px rgba(0,0,0,.4)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
.float{position:fixed;font-size:13px;font-weight:800;color:var(--acc);pointer-events:none;z-index:60;animation:up .9s ease-out forwards}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
.conf{position:fixed;width:7px;height:7px;border-radius:2px;z-index:61;pointer-events:none;animation:fall 1.3s ease-out forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
.sync{font-size:11px;color:var(--mute);text-align:center;margin:2px 0 12px}
.qbar{display:flex;align-items:center;gap:10px;margin-top:12px}
.qbar .bar{flex:1}
.qbar span{font-size:12px;font-weight:700;color:var(--mute)}
details summary{cursor:pointer}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="rest"><div class="in"><span>Отдых</span><span class="tm" id="restT">0:00</span><button id="restAdd">+15 с</button><button id="restSkip">Дальше</button></div></div>
<div id="modal"><div class="in card" id="modalIn"></div></div>
<div id="toast"></div>
<nav id="nav"><div class="in">
<button data-tab="home"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Сегодня</span></button>
<button data-tab="quest"><svg class="i" viewBox="0 0 24 24"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg><span>Тренировка</span></button>
<button data-tab="prog"><svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Прогресс</span></button>
<button data-tab="plan"><svg class="i" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11"/></svg><span>План</span></button>
</div></nav>
<script>
"use strict";
/* ============ TELEGRAM ============ */
const tg=(window.Telegram&&window.Telegram.WebApp)||null;
const inTg=!!(tg&&tg.initData);
const tgOk=v=>{try{return inTg&&tg.isVersionAtLeast(v)}catch(e){return false}};
if(inTg){try{tg.ready();tg.expand();if(tgOk('6.1')){tg.setHeaderColor('#0e1014');tg.setBackgroundColor('#0e1014')}if(tgOk('7.7'))tg.disableVerticalSwipes()}catch(e){}}
const haptic=t=>{try{if(tgOk('6.1')){t==='ok'?tg.HapticFeedback.notificationOccurred('success'):tg.HapticFeedback.impactOccurred(t||'light')}else if(navigator.vibrate)navigator.vibrate(15)}catch(e){}};

/* ============ СПРАВОЧНИКИ ============ */
const GOALS={gain:'Набор мышечной массы',lose:'Похудение',fit:'Форма и здоровье',str:'Сила'};
const PLACES={gym:'Тренажёрный зал',home:'Дом'};
const EXPS=['Новичок','Немного занимался','Уверенно'];
const ACTS=['Сидячий','Средний','Высокий (на ногах, физ. работа)'];
const ACTF=[1.35,1.5,1.65];
const LIMS={b:'Поясница',s:'Плечи',k:'Колени',n:'Шея',p:'Осанка, прогиб в пояснице'};
const EQS={d:'Гантели',k:'Гиря',b:'Турник',r:'Резинки'};
const CATS={push:'Грудь · плечи · трицепс',pull:'Спина · бицепс',legs:'Ноги · ягодицы',core:'Кор',mob:'Разминка и мобильность'};
const UNITS={reps:'повт',sec:'сек',min:'мин'};
const DOWS=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const DOW_ORDER=[1,2,3,4,5,6,0];
const DEF_DOWS={2:[1,4],3:[1,3,5],4:[1,2,4,5],5:[1,2,3,5,6],6:[1,2,3,4,5,6]};

/* st — шаг веса; per:2 — вес одной гантели; bw — свой вес (+доп. вес); k — стартовый ориентир в долях веса тела;
   bad — при каких ограничениях исключать; need — какой инвентарь нужен дома (любой из) */
const EX={
/* --- ноги --- */
backsquat:{n:'Приседания со штангой',c:'legs',m:'Квадрицепсы, ягодицы, кор',eq:'Штанга, стойки',st:2.5,k:.7,bad:'bk',
 how:['Гриф на трапециях, стопы чуть шире плеч, носки слегка наружу.','Вдох, напряги пресс. Таз назад и вниз, колени идут по линии носков.','Опустись до параллели бёдер с полом и вставай, толкая пол всей стопой.'],
 cue:['Рёбра опущены, пресс напряжён — без лишнего прогиба в пояснице','Страховочные упоры выставь чуть ниже нижней точки'],err:['Пятки отрываются от пола','Колени заваливаются внутрь','Внизу таз «подкручивается» и округляется поясница — сократи глубину']},
legpress:{n:'Жим ногами',c:'legs',m:'Квадрицепсы, ягодицы',eq:'Тренажёр',st:5,k:1.2,
 how:['Стопы на ширине плеч на середине платформы.','Опускай платформу, пока таз не начнёт отрываться от спинки, — и не ниже.','Выжимай через всю стопу, колени в верхней точке не выпрямляй до щелчка.'],
 cue:['Поясница и таз всё время прижаты к спинке'],err:['Таз отрывается внизу','Колени сводятся внутрь','Полное «вставление» коленей вверху']},
goblet:{n:'Гоблет-присед',c:'legs',m:'Квадрицепсы, ягодицы, кор',eq:'Гантель или гиря',st:2,k:.22,need:'dk',
 how:['Гантель или гиря у груди, локти вниз, стопы чуть шире плеч.','Садись между пятками, колени по направлению носков.','Пауза 1–2 с внизу, вставай.'],
 cue:['Вверху сожми ягодицы, но не прогибайся'],err:['Отрыв пяток','Округление спины внизу'],prog:['Пауза 2 с внизу','Темп 4 с вниз','«Полтора повтора»']},
bwsquat:{n:'Приседания с паузой',c:'legs',m:'Квадрицепсы, ягодицы',eq:'Свой вес',lo:15,hi:25,u:'reps',rest:60,
 how:['Стопы чуть шире плеч, руки перед собой.','Опускайся 3 секунды, пауза 2 с внизу.','Вставай без рывка.'],cue:['Медленный темп делает свой вес тяжёлым'],err:['Отрыв пяток'],prog:['Темп 3 с вниз + пауза','«Полтора повтора»','Приседания на одной ноге к стулу']},
rdl:{n:'Румынская тяга со штангой',c:'legs',m:'Задняя поверхность бедра, ягодицы',eq:'Штанга',st:2.5,k:.6,bad:'b',
 how:['Штанга в опущенных руках, колени слегка согнуты.','Отводи таз назад, гриф скользит вдоль бёдер, спина прямая.','Опусти до середины голени и вставай, толкая таз вперёд.'],
 cue:['Тянет заднюю поверхность бедра, а не поясницу','Вверху просто встань прямо, без отклонения назад'],err:['Округление спины','Гриф уходит далеко от ног','Переразгибание поясницы вверху']},
dbrdl:{n:'Румынская тяга с гантелями',c:'legs',m:'Задняя поверхность бедра, ягодицы',eq:'Гантели',st:2,per:2,k:.2,bad:'b',need:'d',
 how:['Гантели вдоль бёдер, колени слегка согнуты.','Отводи таз назад, спина прямая, гантели скользят вдоль ног.','Вставай, толкая таз вперёд.'],
 cue:['Растяжение в задней части бедра'],err:['Округление спины','Переразгибание вверху'],prog:['Темп 3 с вниз','Пауза внизу','На одной ноге']},
hyper:{n:'Гиперэкстензия',c:'legs',m:'Ягодицы, задняя поверхность бедра, разгибатели спины',eq:'Римский стул',bw:1,st:2.5,lo:10,hi:15,u:'reps',rest:75,
 how:['Упор под таз, чтобы можно было свободно сгибаться в тазобедренных.','Опускайся с прямой спиной.','Поднимайся до прямой линии тела, сжимая ягодицы.'],
 cue:['Вверху — прямая линия, не выше'],err:['Переразгибание поясницы вверху','Рывки']},
legcurl:{n:'Сгибание ног в тренажёре',c:'legs',m:'Задняя поверхность бедра',eq:'Тренажёр',st:5,k:.4,
 how:['Валик чуть выше пяток, таз прижат.','Сгибай ноги до конца, пауза 1 с.','Опускай 2–3 секунды.'],cue:['Таз не отрывается'],err:['Рывок тазом','Бросание веса вниз']},
legext:{n:'Разгибание ног в тренажёре',c:'legs',m:'Квадрицепсы',eq:'Тренажёр',st:5,k:.45,bad:'k',

const $=s=>document.querySelector(s);

const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmtD=k=>{const d=parseD(k);return d.getDate()+'.'+pad(d.getMonth()+1)};
const weekKey=k=>{const d=parseD(k);return dkey(addDays(d,-((d.getDay()+6)%7)))};
const num=v=>parseFloat(String(v==null?'':v).replace(',','.'));
const fw=w=>String(Math.round(w*100)/100).replace('.',',');

/* ============ СОСТОЯНИЕ ============ */
const LS='forma-v2',LSD='forma-v2-dirty';
function blankMeta(){return {u:0,resetAt:0,profile:null,dows:null,swaps:{},seen:{lvl:1,ach:[]}}}
function normProfile(o){if(!o||typeof o!=='object')return null;
 const p={n:String(o.n||'').slice(0,40),s:o.s==='f'?'f':'m',a:Math.round(+o.a),h:Math.round(+o.h),w:Math.round(+o.w*10)/10,
  g:GOALS[o.g]?o.g:'fit',tw:+o.tw>0?Math.round(+o.tw*10)/10:0,p:PLACES[o.p]?o.p:'gym',q:String(o.q||'').replace(/[^dkbr]/g,''),
  e:Math.min(2,Math.max(0,Math.round(+o.e)||0)),d:Math.min(6,Math.max(2,Math.round(+o.d)||3)),af:Math.min(2,Math.max(0,Math.round(+o.af)||0)),
  l:String(o.l||'').replace(/[^bsknp]/g,''),ts:+o.ts||Date.now()};
 if(!(p.a>=10&&p.a<=95&&p.h>=120&&p.h<=230&&p.w>=30&&p.w<=250))return null;return p}
function normMeta(o){const b=blankMeta();o=o&&typeof o==='object'?o:{};
 return {u:+o.u||0,resetAt:+o.resetAt||0,profile:normProfile(o.profile),dows:Array.isArray(o.dows)?o.dows.filter(x=>x>=0&&x<=6):null,
  swaps:o.swaps&&typeof o.swaps==='object'?o.swaps:{},seen:Object.assign(b.seen,o.seen||{})}}
function normState(o){o=o&&typeof o==='object'?o:{};return {meta:normMeta(o.meta),days:o.days&&typeof o.days==='object'?o.days:{}}}
let S=normState(null),dirty=new Set(),planCache=null;
try{const raw=localStorage.getItem(LS);if(raw)S=normState(JSON.parse(raw));dirty=new Set(JSON.parse(localStorage.getItem(LSD)||'[]'))}catch(e){}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S));localStorage.setItem(LSD,JSON.stringify([...dirty]))}catch(e){}}
const ckey=k=>'d'+k.replace(/-/g,'');
const dfromc=c=>c.slice(1,5)+'-'+c.slice(5,7)+'-'+c.slice(7,9);
function commitDay(k){if(S.days[k])S.days[k].u=Date.now();dirty.add(ckey(k));saveLocal();scheduleFlush()}
function commitMeta(){S.meta.u=Date.now();planCache=null;dirty.add('meta');saveLocal();scheduleFlush()}

/* ============ СИНХРОНИЗАЦИЯ: Telegram CloudStorage ============ */
const CS=tgOk('6.9')&&tg.CloudStorage?tg.CloudStorage:null;
let syncState=CS?'loading':'local',cloudReady=!CS,flushT=null,flushing=false;
const csCall=(fn,...a)=>new Promise((res,rej)=>{try{CS[fn](...a,(e,v)=>e?rej(e):res(v))}catch(e){rej(e)}});
function renderSync(){const el=$('#sync');if(!el)return;
 el.textContent={local:'Прогресс хранится на этом устройстве',loading:'Загрузка из облака…',ok:'Прогресс сохранён в облаке Telegram',saving:'Сохраняю…',offline:'Облако недоступно — сохраняю на устройстве'}[syncState]||''}
function scheduleFlush(){if(!CS||!cloudReady)return;clearTimeout(flushT);flushT=setTimeout(flush,700)}
async function flush(){if(!CS||!cloudReady||flushing||!dirty.size)return;flushing=true;syncState='saving';renderSync();
 try{for(const c of [...dirty]){
   if(c==='meta')await csCall('setItem','meta',JSON.stringify(S.meta));
   else{const L=S.days[dfromc(c)];const v=L?JSON.stringify(L):'';
    if(L&&v.length<=4096)await csCall('setItem',c,v);else if(!L)await csCall('removeItem',c)}
   dirty.delete(c)}
  syncState='ok'}catch(e){syncState='offline'}
 saveLocal();flushing=false;renderSync();if(dirty.size&&syncState==='ok')scheduleFlush()}
function mergeRemote(remote){
 let rm=null;try{rm=remote.meta?normMeta(JSON.parse(remote.meta)):null}catch(e){}
 if(rm){const lp=S.meta.profile,rp=rm.profile;const prof=rp&&(!lp||rp.ts>lp.ts)?rp:lp;
  const resetAt=Math.max(S.meta.resetAt,rm.resetAt);
  if(rm.u>S.meta.u){S.meta=rm}else if(S.meta.u>rm.u)dirty.add('meta');
  if(S.meta.profile!==prof){S.meta.profile=prof;dirty.add('meta')}
  S.meta.resetAt=resetAt}
 else if(S.meta.u||S.meta.profile)dirty.add('meta');
 const ra=S.meta.resetAt;
 for(const c in remote){if(c==='meta')continue;const k=dfromc(c);let r=null;try{r=JSON.parse(remote[c])}catch(e){}
  if(!r||typeof r!=='object'||(+r.u||0)<ra){dirty.add(c);if(S.days[k]&&(+S.days[k].u||0)<ra)delete S.days[k];continue}
  const L=S.days[k];if(!L||(+r.u||0)>(+L.u||0))S.days[k]=r;else if((+L.u||0)>(+r.u||0))dirty.add(c)}
 for(const k in S.days){if((+S.days[k].u||0)<ra){delete S.days[k];continue}if(!(ckey(k) in remote))dirty.add(ckey(k))}
 planCache=null;saveLocal()}
async function initCloud(){if(!CS)return;
 const timer=setTimeout(()=>{if(!cloudReady){cloudReady=true;syncState='offline';render()}},6000);
 try{const keys=(await csCall('getKeys'))||[];const want=keys.filter(k=>k==='meta'||/^d\d{8}$/.test(k));const remote={};
  for(let i=0;i<want.length;i+=40)Object.assign(remote,await csCall('getItems',want.slice(i,i+40)));
  mergeRemote(remote);syncState='ok'}catch(e){syncState='offline'}
 clearTimeout(timer);cloudReady=true;render();flush()}

/* анкета из бота: ?p=<base64url JSON> */
function readUrlProfile(){try{const q=new URLSearchParams(location.search).get('p');if(!q)return null;
 const b=q.replace(/-/g,'+').replace(/_/g,'/');const bin=atob(b+'==='.slice((b.length+3)%4));
 return normProfile(JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))))}catch(e){return null}}
function applyProfile(p){const old=S.meta.profile;
 if(old&&(old.p!==p.p||old.d!==p.d||old.q!==p.q||old.l!==p.l||old.e!==p.e))S.meta.swaps={};
 if(!old||old.d!==p.d||!S.meta.dows||S.meta.dows.length!==p.d)S.meta.dows=DEF_DOWS[p.d].slice();
 S.meta.profile=p;commitMeta()}
(function(){const up=readUrlProfile();if(up&&(!S.meta.profile||up.ts>S.meta.profile.ts))applyProfile(up)})();

/* ============ ГЕНЕРАТОР ПЛАНА ============ */
function cands(slot,p){const s=SLOT[slot];const list=Array.isArray(s)?s:(s[p.p]||[]);
 return list.map(c=>Array.isArray(c)?c:[c,0,9]).filter(([id,mn,mx=9])=>{const e=EX[id];
  return p.e>=mn&&p.e<=mx&&!(e.bad&&[...e.bad].some(x=>p.l.includes(x)))&&(p.p!=='home'||!e.need||[...e.need].some(x=>p.q.includes(x)))}).map(c=>c[0])}
function mkItem(id,n,kind,p){const e=EX[id];const R=RANGE[p.g][kind]||[e.lo,e.hi,e.rest];
 return {id,n,lo:e.lo!=null?e.lo:R[0],hi:e.hi!=null?e.hi:R[1],rest:e.rest!=null?e.rest:R[2]}}
function warmup(p){const w=[p.p==='gym'?'cardio5':'joint','deadbug','bridge'];
 if(p.l.includes('p'))w.push('hipflex','wallslide');if(p.l.includes('n'))w.push('chintuck');return w}
function plan(){const p=S.meta.profile;if(!p)return null;if(planCache)return planCache;
 const warm=warmup(p);const names=SPLIT[p.d];
 const workouts=names.map((nm,wi)=>{const T=TPL[nm];const used=new Set(warm);const items=[];
  for(const [slot,n0,kind,minLv=0] of T.items){if(p.e<minLv)continue;
   const c=cands(slot,p).filter(id=>!used.has(id));if(!c.length)continue;
   const sw=S.meta.swaps[wi+':'+slot];const id=sw&&c.includes(sw)?sw:c[0];used.add(id);
   let n=n0;if(p.e===0)n=Math.max(2,n-1);if(kind==='c'&&(p.e===2||p.g==='str'))n++;
   items.push(Object.assign(mkItem(id,n,kind,p),{slot,kind,alts:c.filter(x=>x!==id)}))}
  if(p.g==='lose')items.push(Object.assign(mkItem('cardio',1,'k',p),{kind:'k',alts:[]}));
  const wItems=warm.map(id=>Object.assign(mkItem(id,1,'k',p),{kind:'w',alts:[]}));
  const sec=items.reduce((a,it)=>a+it.n*(it.rest+(EX[it.id].u==='min'?it.lo*60:45)*(EX[it.id].side?2:1)),0);
  return {wi,t:T.t,s:T.s,ic:T.ic,min:Math.round((sec/60+10)/5)*5,blocks:[{name:'Разминка',items:wItems},{name:'Основная часть',items}]}});
 const dows=(S.meta.dows&&S.meta.dows.length===p.d?S.meta.dows:DEF_DOWS[p.d]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7));

function derive(){const p=S.meta.profile,keys=Object.keys(S.days).sort(),today=dkey();const nh=p?habits(p).length:5;
 let xp=0,workouts=0,str=0,core=0,prs=0,fullHab=0,ton=0,sets=0,lastW=null;
 const best={},weeks={},ws=[],tests=[],done=new Set();
 for(const k of keys){const L=S.days[k];const dayBest={};
  for(const id in (L.ex||{})){const ex=EX[id];if(!ex)continue;
   for(const s of doneSets(L.ex[id])){xp+=5;sets++;if(ex.c==='core'||ex.c==='mob')core++;else str++;
    if(ex.u!=='sec'&&ex.u!=='min')ton+=s[0]*(s[1]||0)*(ex.per||1)*(ex.side?2:1);
    const sc=score(ex,s);if(sc>0&&(!dayBest[id]||sc>dayBest[id].sc))dayBest[id]={sc,r:s[0],w:s[1]||0,d:k}}}
  for(const id in dayBest){if(best[id]&&dayBest[id].sc>best[id].sc*1.0001)prs++;if(!best[id]||dayBest[id].sc>best[id].sc)best[id]=dayBest[id]}
  const h=L.h||'';xp+=h.length*10;if(h.length>=nh)fullHab++;

  if(L.t&&Object.keys(L.t).length){xp+=30;tests.push(Object.assign({d:k},L.t))}
  if(L.f){if(L.w==='r')xp+=20;else{xp+=50;workouts++;lastW=+L.w||0;done.add(k);const wk=weekKey(k);weeks[wk]=(weeks[wk]||0)+1}}}
 const need=p?p.d:3,cw=weekKey(today),thisWeek=weeks[cw]||0;
 let streak=0,w=parseD(cw);if(thisWeek>=need)streak++;w=addDays(w,-7);while((weeks[dkey(w)]||0)>=need){streak++;w=addDays(w,-7)}
 let bestStreak=0,run=0,prev=null;for(const wk of Object.keys(weeks).sort()){if(weeks[wk]<need){run=0;prev=null;continue}
  run=prev&&dkey(addDays(parseD(prev),7))===wk?run+1:1;prev=wk;bestStreak=Math.max(bestStreak,run)}
 const start=p?{d:dkey(new Date(p.ts)),kg:p.w}:null;const wsAll=start&&(!ws.length||ws[0].d>start.d)?[start].concat(ws):ws;
 const dw=wsAll.length>1?wsAll[wsAll.length-1].kg-wsAll[0].kg:0;
 return {xp,lv:levelFrom(xp),workouts,str,core,prs,fullHab,ton,sets,lastW,best,weeks,thisWeek,need,streak,bestStreak,ws:wsAll,nws:ws.length,dw,tests,done,today}}

function sprite(tier){
 const G=[];for(let y=0;y<20;y++)G.push(Array(20).fill('.'));
 const put=(x,y,c)=>{if(x>=0&&x<20&&y>=0&&y<20)G[y][x]=c};
 const row=(y,a,b,c)=>{for(let x=a;x<=b;x++)put(x,y,c)};
 const sw=[6,8,10,12][tier],at=tier>=2?2:1;
 if(tier>=3)for(let y=7;y<=17;y++){const w=sw+(y>11?2:0);row(y,10-w/2,10+w/2-1,'c')}
 row(1,7,12,'h');put(7,2,'h');row(2,8,11,'s');put(12,2,'h');
 row(3,7,12,tier>=1?'r':'s');if(tier>=1){put(13,3,'r');put(14,4,'r')}
 put(7,4,'s');put(8,4,'e');row(4,9,10,'s');put(11,4,'e');put(12,4,'s');
 row(5,8,11,'s');row(6,9,10,'s');
 for(let y=7;y<=12;y++){const t=(y-7)/5;const w=Math.round((sw+(6-sw)*t)/2)*2;row(y,10-w/2,10+w/2-1,'t')}
 if(tier>=2){put(9,9,'d');put(10,9,'d');put(9,11,'d');put(10,11,'d')}
 const L=10-sw/2-at,R=10+sw/2;
 for(let y=7;y<=13;y++){const c=y===7?'t':'s';row(y,L,L+at-1,c);row(y,R,R+at-1,c)}
 row(13,7,12,'p');row(14,7,12,'p');
 for(let y=15;y<=17;y++){row(y,7,8,'p');row(y,11,12,'p')}
 row(18,6,8,'b');row(18,11,13,'b');
 if(tier>=3)row(2,8,11,'g'),put(8,1,'g'),put(10,0,'g'),put(11,1,'g');
 const shirt=['#6b7a99','#4f7cff','#8a5cff','#f2c14e'][tier];
 const C={h:'#2b1d14',s:'#e0ac7e',e:'#141414',r:'#f0616d',t:shirt,d:'rgba(0,0,0,.28)',p:'#2c2f45',b:'#5a3a22',c:'#c23b4b',g:'#ffd84d'};
 let out='';for(let y=0;y<20;y++)for(let x=0;x<20;x++){const c=G[y][x];if(c!=='.')out+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${C[c]}"/>`}

function lineChart(pts,{goal,goalLabel='цель'}={}){
 if(pts.length<2)return `<div class="small mute" style="padding:18px 0;text-align:center">Для графика нужны минимум две записи</div>`;
 const W=320,H=150,P=30;const xs=pts.map(p=>parseD(p.d).getTime()),ys=pts.map(p=>p.v);
 let y0=Math.min(...ys),y1=Math.max(...ys);if(goal){y1=Math.max(y1,goal);y0=Math.min(y0,goal)}
 if(y1-y0<2){y0-=1;y1+=1}const x0=Math.min(...xs),x1=Math.max(...xs);
 const X=t=>P+(t-x0)/((x1-x0)||1)*(W-P-10),Y=v=>H-18-(v-y0)/(y1-y0)*(H-32);
 let g='';
 [y0,(y0+y1)/2,y1].forEach(v=>{g+=`<line x1="${P}" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2a2f3b"/><text x="${P-5}" y="${Y(v)+3}" fill="#8b93a5" font-size="9" text-anchor="end">${Math.round(v*10)/10}</text>`});
 if(goal)g+=`<line x1="${P}" x2="${W-10}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="#4fd08a" stroke-dasharray="4 4"/><text x="${W-12}" y="${Y(goal)-4}" fill="#4fd08a" font-size="9" text-anchor="end">${goalLabel}</text>`;
 g+=`<polyline fill="none" stroke="#f2c14e" stroke-width="2" stroke-linejoin="round" points="${pts.map((p,i)=>X(xs[i])+','+Y(p.v)).join(' ')}"/>`;
 pts.forEach((p,i)=>{g+=`<circle cx="${X(xs[i])}" cy="${Y(p.v)}" r="3" fill="#f2c14e" stroke="#171a21" stroke-width="1.5"/>`});
 g+=`<text x="${P}" y="${H-3}" fill="#8b93a5" font-size="9">${fmtD(pts[0].d)}</text><text x="${W-10}" y="${H-3}" fill="#8b93a5" font-size="9" text-anchor="end">${fmtD(pts[pts.length-1].d)}</text>`;
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">${g}</svg>`}
function paceText(p,ws){if(ws.length<2)return '';const a=ws[0],b=ws[ws.length-1],days=(parseD(b.d)-parseD(a.d))/864e5;if(days<7)return 'Темп посчитаю через неделю взвешиваний.';
 const pw=(b.kg-a.kg)/days*7,t=`Темп: ${pw>=0?'+':''}${fw(Math.round(pw*100)/100)} кг в неделю. `;
 if(p.g==='gain')return t+(pw<.1?'Мало — добавь около 200 ккал.':pw>.5?'Быстро, может расти жир — убавь около 150 ккал.':'Хороший темп.');
 if(p.g==='lose')return t+(pw>-.2?'Медленно — убери 150–200 ккал или добавь шагов.':pw<-1?'Слишком быстро — добавь около 200 ккал, чтобы не терять мышцы.':'Хороший темп.');
 return t+(Math.abs(pw)<.25?'Вес стабилен.':'Вес заметно меняется — проверь калории.')}

function ensureLog(k){if(!S.days[k])S.days[k]={u:0,ex:{},f:0,h:''};const L=S.days[k];if(!L.ex)L.ex={};if(L.h==null)L.h='';return L}
function materialize(id,s){const it=wItems(s).find(x=>x.id===id);const L=ensureLog(dkey());
 if(!L.ex[id]||L.ex[id].length<it.n)L.ex[id]=getSets(it).sets.map(x=>x.slice());return {arr:L.ex[id],it,L}}
function toast(t){const el=document.createElement('div');el.textContent=t;$('#toast').appendChild(el);setTimeout(()=>el.remove(),2600)}
function floatXP(el,t){const r=el.getBoundingClientRect();const f=document.createElement('div');f.className='float';f.textContent=t;f.style.left=(r.left+r.width/2-22)+'px';f.style.top=(r.top-8)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),950)}
function confetti(){const cols=['#f2c14e','#4fd08a','#5aa9f5','#f0616d','#b48cff'];for(let i=0;i<36;i++){const c=document.createElement('div');c.className='conf';c.style.left=(innerWidth/2)+'px';c.style.top=(innerHeight/2)+'px';c.style.background=cols[i%5];c.style.setProperty('--dx',(Math.random()*2-1)*innerWidth*.5+'px');c.style.setProperty('--dy',(Math.random()*2-1)*innerHeight*.45+'px');document.body.appendChild(c);setTimeout(()=>c.remove(),1400)}}
let actx=null;function beep(){try{if(actx){const g=actx.createGain();g.gain.value=.06;g.connect(actx.destination);[[880,0],[1320,.22]].forEach(([f,t])=>{const o=actx.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.18)})}}catch(e){}haptic('ok')}
let restI=null,restEnd=0;
const fmtT=s=>Math.floor(s/60)+':'+pad(s%60);
function tickRest(){const left=Math.ceil((restEnd-Date.now())/1000);if(left<=0){stopRest();beep();toast('Отдых окончен — следующий подход');return}$('#restT').textContent=fmtT(left)}
function startRest(sec){if(!sec)return;clearInterval(restI);restEnd=Date.now()+sec*1000;$('#rest').style.display='flex';tickRest();restI=setInterval(tickRest,250)}
function stopRest(){clearInterval(restI);$('#rest').style.display='none'}
$('#restSkip').onclick=stopRest;
$('#restAdd').onclick=()=>{restEnd+=15000;tickRest()};
function modal(html,btn='Дальше'){$('#modalIn').innerHTML=html+(btn?`<button class="btn acc wide" style="margin-top:16px" data-a="closem">${btn}</button>`:'');$('#modal').style.display='flex'}
const closeModal=()=>{$('#modal').style.display='none'};
function checkRewards(){const d=derive();
 const newAch=ACH.filter(a=>a[4](d)&&!S.meta.seen.ach.includes(a[0]));const lvUp=d.lv.l>(S.meta.seen.lvl||1);
 if(newAch.length||lvUp){S.meta.seen.ach=S.meta.seen.ach.concat(newAch.map(a=>a[0]));S.meta.seen.lvl=d.lv.l;commitMeta()}
 return {d,newAch,lvUp}}
const rewardHtml=r=>(r.lvUp?`<div class="hint" style="text-align:center;font-weight:700">Новый уровень: ${r.d.lv.l}</div>`:'')+(r.newAch.length?`<div class="ach" style="margin-top:10px">${r.newAch.map(x=>`<div><b>${x[1]}</b>${esc(x[2])}</div>`).join('')}</div>`:'');
function showRewards(r){if(r.lvUp||r.newAch.length){haptic('ok');modal(`<h2>Награда</h2>${rewardHtml(r)}`)}}
function saveForm(){const dows=F.dows;const p=normProfile(Object.assign({},F,{a:num(F.a),h:num(F.h),w:num(F.w),tw:num(F.tw)||0,ts:Date.now()}));
 if(!p){toast('Проверь возраст, рост и вес');return}
 if(dows&&dows.length!==p.d&&S.meta.profile&&S.meta.profile.d===p.d){toast('Выбери дней тренировок: '+p.d);return}
 applyProfile(p);if(dows&&dows.length===p.d){S.meta.dows=dows.slice();commitMeta()}
 F=null;settings=false;sel=null;open.clear();toast('План обновлён');haptic('ok');tab='home';render();window.scrollTo(0,0)}

document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;if(F&&f&&!e.target.dataset.a)F[f]=e.target.value});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset&&t.dataset.a;
 if(a==='liftsel'){liftSel=t.value;render();return}
 if(a==='setv'){const s=curSel(derive()),{arr}=materialize(t.dataset.k,s),i=+t.dataset.i,f=+t.dataset.f;let v=num(t.value);if(isNaN(v)||v<0)v=0;v=f?Math.round(v*100)/100:Math.round(v);
  arr[i][f]=v;if(f)for(let j=i+1;j<arr.length;j++)if(!arr[j][2])arr[j][1]=v;commitDay(dkey());render()}});
document.addEventListener('click',e=>{
 const nb=e.target.closest('nav button');if(nb){go(nb.dataset.tab);return}
 const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;
 const a=b.dataset.a,id=b.dataset.k,k=dkey();
 if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(err){}}
 if(a==='tab'){go(b.dataset.t);return}
 if(a==='settings'){settings=true;F=null;render();window.scrollTo(0,0);return}
 if(a==='fclose'){settings=false;F=null;render();return}
 if(a==='fc'){const f=b.dataset.f,v=b.dataset.v;F[f]=['e','d','af'].includes(f)?+v:v;if(f==='d')F.dows=DEF_DOWS[+v].slice();render();return}
 if(a==='fm'){const f=b.dataset.f,v=b.dataset.v;F[f]=F[f].includes(v)?F[f].replace(v,''):F[f]+v;render();return}
 if(a==='fdow'){const v=+b.dataset.v,cur=(F.dows||DEF_DOWS[F.d]).slice();const i=cur.indexOf(v);i>=0?cur.splice(i,1):cur.push(v);F.dows=cur;render();return}
 if(a==='fsave'){saveForm();return}
 if(a==='closem'){closeModal();return}
 const d0=derive(),s=curSel(d0);
 if(a==='goquest'||a==='trainnow'){if(a==='trainnow')sel=nextIdx(d0);const ss=curSel(d0),L=S.days[k];
  const first=wItems(ss).find(it=>{const x=L&&L.ex&&L.ex[it.id];return !(x&&x.length>=it.n&&x.every(z=>z[2]))});open.clear();if(first)open.add(first.id);go('quest');return}
 if(a==='pick'){sel=b.dataset.w==='r'?'r':+b.dataset.w;open.clear();render();return}
 if(a==='open'){open.has(id)?open.delete(id):open.add(id);render();return}
 if(a==='info'){info.has(id)?info.delete(id):info.add(id);render();return}
 if(a==='inc'||a==='dec'){const {arr,it}=materialize(id,s),ex=EX[id],i=+b.dataset.i,f=+b.dataset.f;
  const step=f?ex.st:(ex.u==='sec'?5:1);arr[i][f]=Math.max(0,Math.round((arr[i][f]+(a==='inc'?step:-step))*100)/100);
  if(f)for(let j=i+1;j<arr.length;j++)if(!arr[j][2])arr[j][1]=arr[i][1];haptic('light');commitDay(k);render();return}
 if(a==='addset'){const {arr}=materialize(id,s),l=arr[arr.length-1];arr.push([l[0],l[1],0]);commitDay(k);render();return}
 if(a==='tick'){const {arr,it,L}=materialize(id,s),ex=EX[id],i=+b.dataset.i,was=arr[i][2];
  const before=d0.best[id];arr[i][2]=was?0:1;L.w=s;commitDay(k);
  if(!was){haptic('medium');floatXP(b,'+5 XP');
   const sc=score(ex,arr[i]);if(before&&before.d!==k&&sc>before.sc*1.0001)toast('🏆 Личный рекорд: '+ex.n);
   const allDone=arr.every(x=>x[2]);startRest(allDone?Math.min(60,it.rest):it.rest);
   if(allDone){const its=wItems(s),idx=its.findIndex(x=>x.id===id);open.delete(id);const nx=its.slice(idx+1).find(x=>{const z=L.ex[x.id];return !(z&&z.length>=x.n&&z.every(q=>q[2]))});if(nx){open.add(nx.id);render();setTimeout(()=>{const el=document.querySelector(`[data-a="open"][data-k="${nx.id}"]`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},60);return}}}
  render();return}
 if(a==='swap'){const it=wItems(s).find(x=>x.id===id);
  modal(`<h2>Заменить упражнение</h2><div class="small mute" style="margin-bottom:10px">Вместо «${esc(EX[id].n)}». Замена сохранится в плане.</div>${it.alts.map(x=>`<button class="habit" data-a="doswap" data-k="${id}" data-v="${x}"><span><b>${esc(EX[x].n)}</b><br><span class="small mute">${esc(EX[x].eq)}</span></span></button>`).join('')}`,'Отмена');return}
 if(a==='doswap'){const it=wItems(s).find(x=>x.id===id),L=S.days[k];if(it&&it.slot){S.meta.swaps[s+':'+it.slot]=b.dataset.v;commitMeta();
   if(L&&L.ex&&L.ex[id]&&!doneSets(L.ex[id]).length){delete L.ex[id];commitDay(k)}open.delete(id);open.add(b.dataset.v)}closeModal();render();return}
 if(a==='finish'){const L=ensureLog(k);if(L.f)return;L.f=1;L.w=s;commitDay(k);stopRest();confetti();haptic('ok');
  const r=checkRewards();let sets=0,ton=0;for(const x in L.ex){const ex=EX[x];if(!ex)continue;doneSets(L.ex[x]).forEach(z=>{sets++;if(ex.u!=='sec'&&ex.u!=='min')ton+=z[0]*(z[1]||0)*(ex.per||1)*(ex.side?2:1)})}
  modal(`<h2>Тренировка завершена</h2><h3 style="text-align:center;margin:6px 0 12px">${esc(workout(s).t)}</h3>
  <div class="kpis" style="margin:0"><div class="kpi"><b>${sets}</b><span>подходов</span></div><div class="kpi"><b>${Math.round(ton)}</b><span>кг поднято</span></div><div class="kpi"><b>${r.d.thisWeek}/${r.d.need}</b><span>за неделю</span></div></div>${rewardHtml(r)}
  <p class="small mute" style="margin-bottom:0">${s==='r'?'Восстановление тоже часть плана.':'Поешь в течение пары часов: белок и углеводы. И отметь привычки дня.'}</p>`);sel=null;render();return}
 if(a==='hab'){const L=ensureLog(k),h=b.dataset.k,had=L.h.includes(h);L.h=had?L.h.replace(h,''):L.h+h;commitDay(k);if(!had){haptic('light');floatXP(b,'+10 XP')}const r=checkRewards();render();showRewards(r);return}
 if(a==='addw'){const v=num($('#wIn').value);if(!(v>30&&v<250)){toast('Введи вес в кг');return}
  ensureLog(k).kg=Math.round(v*10)/10;commitDay(k);planCache=null;toast('Записано: '+fw(v)+' кг · +5 XP');const r=checkRewards();render();showRewards(r);return}
 if(a==='delw'){const L=S.days[b.dataset.d];if(L){delete L.kg;commitDay(b.dataset.d)}render();return}
 if(a==='addtest'){const t={};TESTS.forEach(([x])=>{const v=num($('#t_'+x).value);if(!isNaN(v))t[x]=v});
  if(!Object.keys(t).length){toast('Заполни хотя бы одно поле');return}ensureLog(k).t=Object.assign(S.days[k].t||{},t);commitDay(k);toast('Замеры сохранены · +30 XP');const r=checkRewards();render();showRewards(r);return}
 if(a==='metric'){testMetric=b.dataset.m;render();return}
 if(a==='copy'){const txt=JSON.stringify(S);const ta=$('#bk');ta.value=txt;try{navigator.clipboard.writeText(txt).then(()=>toast('Скопировано'),()=>{ta.select();toast('Выдели текст и скопируй вручную')})}catch(err){ta.select();toast('Выдели текст и скопируй вручную')}return}
 if(a==='import'){try{const o=JSON.parse($('#bk').value);if(!o||!o.meta||!o.days)throw 0;const now=Date.now();S=normState(o);S.meta.resetAt=0;for(const x in S.days){S.days[x].u=now;dirty.add(ckey(x))}commitMeta();F=null;settings=false;toast('Прогресс загружен');render()}catch(err){toast('Не получилось прочитать копию')}return}
 if(a==='reset'){if(!confirmReset){confirmReset=true;render();setTimeout(()=>{if(confirmReset){confirmReset=false;if(settings)render()}},4000);return}
  confirmReset=false;for(const x in S.days)dirty.add(ckey(x));S.days={};S.meta.resetAt=Date.now();S.meta.seen={lvl:1,ach:[]};commitMeta();toast('Прогресс сброшен');render();return}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
if(inTg&&tgOk('6.1')){try{tg.BackButton.onClick(()=>{settings=false;F=null;render()})}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();else if(S.meta.profile&&!settings)render()});
render();
initCloud();
</script>
</body>
</html>
